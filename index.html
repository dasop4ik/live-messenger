<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtroom Live Messenger (Tabrica)</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  :root {
    --bg-body: radial-gradient(circle at 50% 30%, #3a7ca5 0%, #1a3b5c 60%, #0a1a2a 100%);
    --bg-window: rgba(240,248,255,.4); --bg-sidebar: rgba(255,255,255,.65);
    --bg-chat: rgba(255,255,255,.85); --bg-messages: #fff; --bg-input: rgba(240,248,255,.7);
    --text-main: #1a1a1a; --text-muted: #666; --border-light: rgba(255,255,255,.8);
    --border-dark: rgba(0,0,0,.1);
    --msg-them-bg: linear-gradient(180deg,#fff 0%,#f0f0f0 100%);
    --msg-them-text: #222;
    --msg-me-bg: linear-gradient(180deg,#e0f0ff 0%,#cce5ff 100%);
    --msg-me-text: #003366;
    --contact-hover: rgba(255,255,255,.5);
    --contact-active: linear-gradient(180deg,rgba(208,232,255,.8) 0%,rgba(160,204,255,.8) 100%);
    --popup-bg: rgba(255,255,255,.95); --btn-bg: rgba(255,255,255,.2);
    --btn-hover: rgba(255,255,255,.6); --story-ring: #4a90e2;
  }
  body {
    margin: 0; min-height: 100vh; background: var(--bg-body); background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px;
    color: var(--text-main); padding: 20px; overflow: hidden;
  }
  .aero-window {
    width: min(1000px,100%); height: min(700px,90vh); background: var(--bg-window);
    backdrop-filter: blur(15px); border: 1px solid var(--border-light); border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; overflow: hidden;
  }
  .aero-window.hidden { display: none; }
  .title-bar {
    background: linear-gradient(180deg,rgba(40,40,40,.85) 0%,rgba(20,20,20,.95) 100%);
    padding: 5px 10px; display: flex; align-items: center; justify-content: space-between;
    color: #fff; font-size: 13px; border-bottom: 1px solid rgba(0,0,0,.5);
  }
  .title-bar-controls button { width: 28px; height: 20px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); border-radius: 3px; cursor: pointer; color: #fff; }
  
  .main-area { flex: 1; display: flex; padding: 10px; gap: 10px; overflow: hidden; }
  .sidebar {
    width: 300px; background: var(--bg-sidebar); border: 1px solid var(--border-light);
    border-radius: 6px; display: flex; flex-direction: column;
  }
  .my-profile { padding: 12px; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.2); }
  .my-avatar-container { width: 48px; height: 48px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .my-info { flex: 1; }
  .my-status { font-weight: 700; font-size: 14px; }
  .my-mood { font-size: 11px; color: var(--text-muted); }
  
  .action-bar { display: flex; padding: 8px; border-bottom: 1px solid var(--border-dark); }
  .action-bar button { flex: 1; background: var(--btn-bg); border: 1px solid var(--border-light); border-radius: 4px; padding: 6px; cursor: pointer; font-weight: 600; color: #4a90e2; }
  
  .contact-list { flex: 1; overflow-y: auto; padding: 5px; }
  .contact { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; border-radius: 6px; border: 1px solid transparent; margin-bottom: 2px; }
  .contact:hover { background: var(--contact-hover); }
  .contact.active { background: var(--contact-active); border-color: #4a90e2; }
  .contact-avatar { width: 32px; height: 32px; border-radius: 50%; background: #aaa; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
  .contact-info { flex: 1; overflow: hidden; }
  .contact-name { font-weight: 600; }
  .contact-phone { font-size: 11px; color: #4a90e2; }
  
  .chat-area { flex: 1; background: var(--bg-chat); border: 1px solid var(--border-light); border-radius: 6px; display: flex; flex-direction: column; }
  .chat-header { background: var(--bg-window); border-bottom: 1px solid var(--border-dark); padding: 15px; font-weight: bold; font-size: 16px; }
  
  .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #fff; }
  .msg { display: flex; flex-direction: column; max-width: 80%; }
  .msg-them { align-self: flex-start; } .msg-me { align-self: flex-end; align-items: flex-end; }
  .msg-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .msg-bubble { padding: 8px 14px; border-radius: 8px; font-size: 13px; line-height: 1.4; background: #eee; }
  .msg-them .msg-bubble { background: #fff; border: 1px solid #ddd; border-bottom-left-radius: 0; }
  .msg-me .msg-bubble { background: #e0f0ff; border: 1px solid #cce5ff; color: #003366; border-bottom-right-radius: 0; }
  
  .input-area { padding: 10px; background: var(--bg-input); border-top: 1px solid var(--border-dark); display: flex; gap: 6px; }
  .input-area textarea { flex: 1; height: 50px; resize: none; border: 1px solid var(--border-dark); border-radius: 4px; padding: 8px; font-family: inherit; }
  .gavel-btn { width: 50px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 20px; }
  
  .login-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg,#d9eefc 0%,#b5dcf5 100%); display: flex; align-items: center; justify-content: center; z-index: 10000; }
  .login-overlay.hidden { display: none; }
  .login-box { width: 380px; background: #fff; border-radius: 10px; box-shadow: 0 15px 50px rgba(0,0,0,.3); padding: 20px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
  .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
  .signin-btn { width: 100%; padding: 10px; background: #00aff0; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .login-error { color: red; font-size: 12px; margin-bottom: 10px; display: none; }
  
  .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal-window { background: #fff; border-radius: 8px; width: 350px; padding: 20px; }
  .modal-body { margin-bottom: 15px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
  .modal-footer button { padding: 8px 15px; border-radius: 4px; cursor: pointer; border: none; }
  .modal-footer .primary { background: #4a90e2; color: #fff; }
</style>
</head>
<body>

<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <h2 style="color:#00aff0; text-align:center; margin-top:0;">Courtroom Live</h2>
    <div class="login-error" id="login-error">Ошибка</div>
    
    <div id="login-view">
      <div class="form-group">
        <label>Телефон</label>
        <input type="text" id="login-username" placeholder="+79991112233" value="+79991112233">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" value="123456">
      </div>
      <button class="signin-btn" onclick="doLogin()">Войти</button>
      <div style="text-align:center; margin-top:15px; font-size:12px;">
        <a href="#" onclick="toggleAuth(true)" style="color:#00aff0;">Нет аккаунта? Зарегистрироваться</a>
      </div>
    </div>

    <div id="register-view" style="display:none;">
      <div class="form-group">
        <label>Телефон</label>
        <input type="text" id="reg-phone" placeholder="+79993334455">
      </div>
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="reg-name" placeholder="Ваше Имя">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="••••••••">
      </div>
      <button class="signin-btn" onclick="registerUser()">Зарегистрироваться</button>
      <div style="text-align:center; margin-top:15px; font-size:12px;">
        <a href="#" onclick="toggleAuth(false)" style="color:#00aff0;">Уже есть аккаунт? Войти</a>
      </div>
    </div>
  </div>
</div>

<div class="aero-window hidden" id="main-window">
  <div class="title-bar">
    <div>⚖️ Courtroom Live (Tabrica)</div>
    <div class="title-bar-controls">
      <button onclick="logout()">Выход</button>
    </div>
  </div>

  <div class="main-area">
    <div class="sidebar">
      <div class="my-profile">
        <div class="my-avatar-container">👤</div>
        <div class="my-info">
          <div class="my-status" id="display-my-name">Загрузка...</div>
          <div class="my-mood" id="display-my-phone">...</div>
        </div>
      </div>
      <div class="action-bar">
        <button onclick="openModal('modal-add-contact')">➕ Добавить контакт</button>
      </div>
      <div class="contact-list" id="contact-list">
        <!-- Контакты будут здесь -->
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="chat-title">Выберите собеседника...</div>
      
      <div class="messages" id="messages">
        <div style="text-align:center; color:#999; margin-top:50px;">Выберите контакт для общения</div>
      </div>

      <div class="input-area" id="inputArea" style="display:none;">
        <textarea id="message-input" placeholder="Сообщение..."></textarea>
        <button class="gavel-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-add-contact">
    <div class="modal-window">
      <h3 style="margin-top:0;">Добавить контакт</h3>
      <div class="modal-body">
        <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:5px;">Номер телефона:</label>
        <input type="text" id="new-contact-phone" placeholder="+79992223344" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        <div id="add-contact-error" style="color:red; font-size:12px; margin-top:10px; display:none;"></div>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal('modal-add-contact')">Отмена</button>
        <button class="primary" onclick="addNewContact()">Добавить</button>
      </div>
    </div>
  </div>
</div>

<script>
  // --- КОНСТАНТЫ ТАБРИКИ ---
  const TABRICA_BASE = "https://api.tabrica.ru";
  const DB_ID = 233;
  const TABLE_USERS = 328;
  const TABLE_MESSAGES = 329;
  const TOKEN = "tab_iTfwAmv8g63qpBJMP37CHhYSh6cS0yNCotnzhiibXTYmqOXFYrQF_Psk5jm6KVI0";

  // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
  let myProfile = null;
  let contacts = [];
  let activeId = null;
  let messageInterval = null;

  // --- API ЗАПРОСЫ ---
  async function apiRequest(endpoint, method = 'GET', body = null) {
    const headers = {
      'Authorization': `Bearer ${TOKEN}`,
      'Content-Type': 'application/json'
    };
    const config = { method, headers };
    if (body) config.body = JSON.stringify(body);
    
    const res = await fetch(`${TABRICA_BASE}${endpoint}`, config);
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'Ошибка API');
    }
    return res.json();
  }

  // --- АВТОРИЗАЦИЯ ---
  function toggleAuth(isRegister) {
    document.getElementById('login-view').style.display = isRegister ? 'none' : 'block';
    document.getElementById('register-view').style.display = isRegister ? 'block' : 'none';
    document.getElementById('login-error').style.display = 'none';
  }

  async function doLogin() {
    const phone = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    try {
      // Получаем пользователей с таким номером
      const res = await apiRequest(`/public/v1/databases/${DB_ID}/tables/${TABLE_USERS}/records?response_format=names`);
      
      // Ищем совпадение по номеру и паролю (так как Табрика не умеет искать по двум полям сразу в одном запросе)
      const user = res.data.records.find(u => u.phone === phone && u.password === password);

      if (!user) throw new Error("Неверный номер телефона или пароль");

      myProfile = { id: user.id, name: user.username, phone: user.phone };
      
      document.getElementById('login-overlay').classList.add('hidden');
      document.getElementById('main-window').classList.remove('hidden');
      
      document.getElementById('display-my-name').textContent = myProfile.name;
      document.getElementById('display-my-phone').textContent = myProfile.phone;

      await loadContacts();
    } catch (e) {
      errEl.textContent = "❌ " + e.message;
      errEl.style.display = 'block';
    }
  }

  async function registerUser() {
    const phone = document.getElementById('reg-phone').value.trim();
    const name = document.getElementById('reg-name').value.trim();
    const password = document.getElementById('reg-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!phone || !name || !password) {
      errEl.textContent = "Заполните все поля";
      errEl.style.display = 'block';
      return;
    }

    try {
      const body = {
        data: {
          username: name,
          phone: phone,
          password: password,
          status: "online",
          bio: "Привет, я в Courtroom Live!"
        }
      };
      
      const res = await apiRequest(`/public/v1/databases/${DB_ID}/tables/${TABLE_USERS}/records`, 'POST', body);
      
      // После успешной регистрации сразу входим
      document.getElementById('login-username').value = phone;
      document.getElementById('login-password').value = password;
      await doLogin();
      
    } catch (e) {
      errEl.textContent = "❌ " + e.message;
      errEl.style.display = 'block';
    }
  }

  function logout() {
    location.reload();
  }

  // --- КОНТАКТЫ ---
  async function addNewContact() {
    const phone = document.getElementById('new-contact-phone').value.trim();
    const errEl = document.getElementById('add-contact-error');
    errEl.style.display = 'none';

    if (!phone) return;

    try {
      const res = await apiRequest(`/public/v1/databases/${DB_ID}/tables/${TABLE_USERS}/records?response_format=names`);
      const user = res.data.records.find(u => u.phone === phone);

      if (!user) throw new Error("Пользователь с таким номером не найден");
      if (user.id === myProfile.id) throw new Error("Это ваш собственный номер");
      
      if (contacts.find(c => c.id === user.id)) {
        throw new Error("Контакт уже добавлен");
      }

      contacts.push({ id: user.id, name: user.username, phone: user.phone });
      localStorage.setItem('tabrica_contacts_' + myProfile.id, JSON.stringify(contacts));
      
      renderContacts();
      closeModal('modal-add-contact');
      document.getElementById('new-contact-phone').value = '';

    } catch (e) {
      errEl.textContent = "❌ " + e.message;
      errEl.style.display = 'block';
    }
  }

  async function loadContacts() {
    // Контакты сохраняются в браузере для простоты
    const saved = localStorage.getItem('tabrica_contacts_' + myProfile.id);
    if (saved) {
      contacts = JSON.parse(saved);
    } else {
      contacts = [];
    }
    renderContacts();
  }

  function renderContacts() {
    const list = document.getElementById('contact-list');
    list.innerHTML = '';
    
    if (contacts.length === 0) {
      list.innerHTML = '<div style="padding:15px; text-align:center; color:#888; font-size:12px;">Нет контактов. Нажмите "Добавить".</div>';
      return;
    }

    contacts.forEach(c => {
      const div = document.createElement('div');
      div.className = 'contact' + (c.id === activeId ? ' active' : '');
      div.innerHTML = `
        <div class="contact-avatar">${c.name[0].toUpperCase()}</div>
        <div class="contact-info">
          <div class="contact-name">${c.name}</div>
          <div class="contact-phone">${c.phone}</div>
        </div>
      `;
      div.onclick = () => selectContact(c);
      list.appendChild(div);
    });
  }

  // --- ЧАТ ---
  function selectContact(contact) {
    activeId = contact.id;
    document.getElementById('chat-title').textContent = "Чат с " + contact.name;
    document.getElementById('inputArea').style.display = 'flex';
    renderContacts();
    
    loadChatHistory();

    // Запускаем опрос новых сообщений каждые 3 секунды
    if (messageInterval) clearInterval(messageInterval);
    messageInterval = setInterval(loadChatHistory, 3000);
  }

  async function loadChatHistory() {
    if (!activeId) return;

    try {
      // Запрашиваем последние 100 сообщений
      const res = await apiRequest(`/public/v1/databases/${DB_ID}/tables/${TABLE_MESSAGES}/records?limit=100&response_format=names`);
      
      // Фильтруем: сообщения между мной и активным контактом
      const filtered = res.data.records.filter(m => 
        (m.sender_id == myProfile.id && m.receiver_id == activeId) || 
        (m.sender_id == activeId && m.receiver_id == myProfile.id)
      );
      
      // Сортируем по ID (предполагая, что ID автоинкремент)
      filtered.sort((a, b) => a.id - b.id);

      const messagesEl = document.getElementById('messages');
      
      // Если изменилось количество сообщений, перерисовываем
      if (messagesEl.children.length !== filtered.length + (filtered.length === 0 ? 1 : 0)) {
        messagesEl.innerHTML = '';
        
        if (filtered.length === 0) {
          messagesEl.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px;">Нет сообщений. Напишите первым!</div>';
        }

        filtered.forEach(m => {
          const div = document.createElement('div');
          const isMe = m.sender_id == myProfile.id;
          div.className = `msg ${isMe ? 'msg-me' : 'msg-them'}`;
          
          const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          
          div.innerHTML = `
            <div class="msg-meta">${time}</div>
            <div class="msg-bubble">${m.content || m.text}</div>
          `;
          messagesEl.appendChild(div);
        });
        
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

    } catch (e) {
      console.error("Ошибка загрузки сообщений:", e);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    
    if (!text || !activeId) return;
    
    input.value = ''; // Очищаем поле сразу

    try {
      const body = {
        data: {
          sender_id: myProfile.id,
          receiver_id: activeId,
          content: text,
          message_type: "text",
          is_read: false
        }
      };

      await apiRequest(`/public/v1/databases/${DB_ID}/tables/${TABLE_MESSAGES}/records`, 'POST', body);
      
      // Мгновенно обновляем историю
      await loadChatHistory();

    } catch (e) {
      alert("Не удалось отправить: " + e.message);
    }
  }

  // Отправка по Enter
  document.getElementById('message-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

</script>
</body>
</html>
